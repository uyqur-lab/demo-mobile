name: ci
on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AC_GATE_LAYER: MB
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: subosito/flutter-action@v2
        with: { channel: stable }

      - run: flutter pub get

      # `flutter analyze` platforma kataloglari yo'q loyihada crash qiladi —
      # `dart analyze` bir xil natijani beradi va barqaror.
      - name: Statik tahlil
        run: dart analyze

      - name: Testlar
        run: |
          if [ -d test ] && ls test/**/*_test.dart test/*_test.dart >/dev/null 2>&1; then
            flutter test --reporter=expanded
          else
            echo "Test fayli yo'q — o'tkazib yuborildi"
          fi
